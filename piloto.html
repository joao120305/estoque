  var nAnt=-1;
  FZ.unsub.push(col('ordens').where('para','==',FZ.uid).onSnapshot(function(s){FZ.Ord=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    var n=FZ.Ord.filter(function(o){return o.status=='enviada'}).length;if(nAnt>=0&&n>nAnt){bip();toast('📋 Nova ordem do patrão!')}nAnt=n;tela()},er));
  FZ.unsub.push(col('pedidos').where('quem','==',FZ.uid).onSnapshot({includeMetadataChanges:true},function(s){
    FZ.Pd=s.docs.map(function(d){return Object.assign({id:d.id,_p:d.metadata&&d.metadata.hasPendingWrites},d.data())});tela()},er));
}

// ---------- contagem de área pelo piloto ----------
FZ.ativa=ls('fzAtiva');   // {id, tal (nome no piloto), feito, last}
setInterval(function(){
  var a=FZ.ativa;if(!a||!FZ.on||!licOk()||typeof S=='undefined')return;
  if(nrm(S.tal)!==nrm(a.tal)){a.last=null;return}
  if(a.last==null){a.last=S.ar;return}
  var d=S.ar-a.last;if(d>0&&d<2)a.feito=(a.feito||0)+d;a.last=S.ar;ls('fzAtiva',a);
  if(Math.abs((a.feito||0)-(a.env||0))>=0.01&&Date.now()-(a.tEnv||0)>15000){a.env=a.feito;a.tEnv=Date.now();
    var b=db.batch();b.set(col('ordens').doc(a.id),{haFeito:Math.round(a.feito*1000)/1000},{merge:true});gravar(b);tela()}
},1000);

// ---------- cálculos ----------
function haT(o){return o.vazao>0&&o.tanque>0?o.tanque/o.vazao:0}
function feito(o){if(FZ.ativa&&FZ.ativa.id==o.id)return FZ.ativa.feito||0;if(o.haFeito>0)return o.haFeito;
  return FZ.Pd.filter(function(p){return p.ordem==o.id&&p.status!='recusado'}).reduce(function(s,p){return s+(p.haCalda||0)},0)}
function talPiloto(o){var k=nrm(o.talNome);for(var t in S.TL)if(nrm(t)==k)return t;return null}
function talFz(nomePiloto){var k=nrm(nomePiloto);for(var id in FZ.T)if(nrm(FZ.T[id].nome)==k)return id;return ''}
function opProd(v){return '<option value="">— produto —</option>'+Object.values(FZ.C).sort(function(a,b){return a.nome.localeCompare(b.nome,'pt')}).map(function(p){return '<option value="'+p.id+'"'+(p.id==v?' selected':'')+'>'+e(p.nome)+'</option>'}).join('')}
function lerCalda(){var c=FZ.calda;if(!c||!q('fz_ct'))return;c.tal=q('fz_ct').value;c.obs=q('fz_co').value;
  c.itens=[].map.call(document.querySelectorAll('#fz_ci .it'),function(d){return{pid:d.querySelector('select').value,qtd:num(d.querySelector('input').value)}})}

// ---------- tela ----------
function painel(){
  if(!auth)return '<div class="pn"><h3>Conta da fazenda</h3><small style="color:var(--bad)">'+e(FZ.msg||'Sem conexão com a conta da fazenda.')+'</small></div>';
  if(!FZ.on&&auth.currentUser&&FZ.msg&&FZ.msg!=='Entrando…')return '<div class="pn"><h3>Conta da fazenda</h3><small class="bad" style="color:var(--bad)">'+e(FZ.msg)+'</small><button data-fz="sair">Sair desta conta</button></div>';
  if(!FZ.on)return '<div class="pn fz"><h3>Entrar com a conta da fazenda</h3><small style="color:var(--mu)">Use o usuário de tratorista que o patrão criou. O login fica salvo neste aparelho.</small>'+
    '<div class="rw"><label>Código da fazenda</label><input id="fz_f" autocapitalize="none" placeholder="ex.: boavista" value="'+e(ls('fazCod')||'')+'"></div>'+
    '<div class="rw"><label>Usuário</label><input id="fz_u" autocapitalize="none" placeholder="ex.: carlos"></div><div class="rw"><label>Senha</label><input id="fz_p" type="password"></div>'+
    '<button class="p" data-fz="login">Entrar</button>'+(FZ.msg?'<small class="bad">'+e(FZ.msg)+'</small>':'')+'</div>'+(auth.currentUser?'<div class="pn"><button data-fz="sair">Sair desta conta</button></div>':'');
  var h='',off=navigator.onLine===false,dias=FZ.lic?(function(){var x=new Date(FZ.lic.validade),y=new Date();x.setHours(0,0,0,0);y.setHours(0,0,0,0);return Math.round((x-y)/86400000)})():0;
  if(!licOk())h+='<div class="pn" style="border-left:5px solid var(--bad)"><b class="bad">🔒 Licença da fazenda vencida.</b><small>Dá para ver as ordens, mas não para enviar pedidos. Fale com o fornecedor do sistema.</small></div>';
  else if(dias<=7)h+='<div class="pn" style="border-left:5px solid var(--ac)"><b>⏰ A licença vence em '+dias+' dia'+(dias==1?'':'s')+'.</b></div>';
  h+='<div class="pn fz"><h3>👷 '+e(FZ.nome)+' <small style="color:var(--mu);font-weight:400">· '+e(FZ.fazNome||FZ.fid)+'</small></h3><div class="rw"><span>Conexão</span><b class="'+(off?'wt':'ok')+'">'+(off?'sem sinal · guardando no aparelho':FZ.pend?'enviando…':'ligado')+'</b></div>'+
    '<div class="rw"><span>Talhão no piloto</span><b>'+e(S.tal)+(talFz(S.tal)?'':' <small class="wt">(não cadastrado na fazenda)</small>')+'</b></div>'+
    '<div class="bt"><button data-fz="avulsa">🧪 Calda sem ordem</button><button data-fz="sair">Sair</button></div></div>';
  if(FZ.calda)h+=painelCalda();
  var L=FZ.Ord.filter(function(o){return o.status=='enviada'||o.status=='andamento'}).sort(function(a,b){return a.criadoEm-b.criadoEm});
  if(!L.length)h+='<div class="pn"><h3>📋 Ordens</h3><small style="color:var(--mu)">Nenhuma ordem do patrão para você agora.</small></div>';
  L.forEach(function(o){var t=haT(o),fe=feito(o),rest=Math.max(o.area-fe,0),sug=+(t?Math.min(t,rest||t):(rest||o.area)).toFixed(2),tp=talPiloto(o),at=FZ.ativa&&FZ.ativa.id==o.id;
    h+='<div class="pn fz fzo"><h3>📋 '+e(o.servico||'Aplicação')+' · '+e(o.talNome)+'</h3>'+
    '<small style="color:var(--mu)">'+fq(o.area)+' ha · enviada por '+e(o.nomePor||'patrão')+' em '+new Date(o.criadoEm).toLocaleDateString('pt-BR')+(o.vazao?' · vazão '+fq(o.vazao)+' L/ha':'')+'</small>'+
    (o.obs?'<div style="background:var(--in);padding:6px 8px;border-radius:8px">📝 '+e(o.obs)+'</div>':'')+
    '<table><tr><th>Produto</th><th class="n">Dose/ha</th>'+(t?'<th class="n">Por tanque</th>':'')+'<th class="n">Total</th></tr>'+
    o.itens.map(function(i){return '<tr><td>'+e(i.nome)+'</td><td class="n">'+fq(i.dose)+' '+e(i.un)+'</td>'+(t?'<td class="n"><b>'+fq(+(i.dose*t).toFixed(3))+' '+e(i.un)+'</b></td>':'')+'<td class="n">'+fq(+(i.dose*o.area).toFixed(3))+' '+e(i.un)+'</td></tr>'}).join('')+'</table>'+
    (t?'<small style="color:var(--mu)">Tanque de '+fq(o.tanque)+' L = <b>'+fq(+t.toFixed(2))+' ha por tanque</b></small>':'')+
    '<div class="rw"><span>Feito</span><b>'+fq(+fe.toFixed(2))+' de '+fq(o.area)+' ha'+(at?' <small class="ok">· medindo pelo piloto</small>':'')+'</b></div>'+
    (tp&&nrm(tp)!=nrm(S.tal)?'<button data-tal="'+e(tp)+'">➜ Ir para o talhão '+e(tp)+'</button>':(!tp?'<small class="wt">O talhão "'+e(o.talNome)+'" não existe no piloto. Crie com o mesmo nome em Talhões para o piloto medir a área.</small>':''))+
    '<div class="bt"><button data-fz="doses" data-id="'+o.id+'">Usar doses no serviço</button>'+
    (at?'<button data-fz="parar">⏸ Parar contagem</button>':'<button data-fz="contar" data-id="'+o.id+'"'+(tp?'':' disabled')+'>▶ Contar área desta ordem</button>')+'</div>'+
    '<div class="rw"><label>Hectares desta calda</label><input id="fz_h_'+o.id+'" type="number" step="any" inputmode="decimal" value="'+sug+'"></div>'+
    '<div class="bt"><button class="p" data-fz="calda" data-id="'+o.id+'">🧪 Montar calda</button><button data-fz="fim" data-id="'+o.id+'">✔ Terminei</button></div></div>'});
  h+=painelPedidos();
  return h}
function painelCalda(){var c=FZ.calda,tals=Object.values(FZ.T).sort(function(a,b){return a.nome.localeCompare(b.nome,'pt',{numeric:true})});
  return '<div class="pn fz fzc"><h3>🧪 Calda · pedido de baixa</h3>'+(c.ordemDesc?'<small>📋 Ordem: <b>'+e(c.ordemDesc)+'</b> · '+fq(c.ha)+' ha</small>':'')+
  '<div class="rw"><label>Talhão</label><select id="fz_ct"><option value="">— escolha —</option>'+tals.map(function(t){return '<option value="'+t.id+'"'+(t.id==c.tal?' selected':'')+'>'+e(t.nome)+'</option>'}).join('')+'</select></div>'+
  '<div id="fz_ci" style="display:flex;flex-direction:column;gap:6px">'+c.itens.map(function(i,k){var p=FZ.C[i.pid];return '<div class="it"><select>'+opProd(i.pid)+'</select><input type="number" step="any" inputmode="decimal" placeholder="Qtd" value="'+(i.qtd||'')+'"><span>'+e(p?p.un:'')+'</span><button data-fz="rm" data-k="'+k+'" style="padding:8px 10px">✕</button></div>'}).join('')+'</div>'+
  '<button data-fz="add">+ Produto</button>'+
  '<div class="rw"><label>Observação</label><input id="fz_co" value="'+e(c.obs||'')+'" placeholder="ex.: tanque 2"></div>'+
  '<div class="bt"><button class="p" data-fz="enviar">📤 Enviar pedido de baixa</button><button data-fz="cx">Cancelar</button></div>'+
  '<small style="color:var(--mu)">O pedido vai para o depósito aceitar ou recusar.</small></div>'}
function painelPedidos(){var L=FZ.Pd.slice().sort(function(a,b){return b.criadoEm-a.criadoEm}).slice(0,12);if(!L.length)return '';
  return '<div class="pn fz"><h3>Meus pedidos</h3>'+L.map(function(p){var st=p._p?'<span class="wt">⏳ aguardando sinal</span>':p.status=='pendente'?'<span class="wt">🕐 esperando o depósito</span>':p.status=='aceito'?'<span class="ok">✔ aceito'+(p.nomeResp?' por '+e(p.nomeResp):'')+'</span>':'<span class="bad">✖ recusado</span>',ac=p.itensAceitos;
    return '<div style="border-bottom:1px solid var(--ln);padding:6px 0"><div class="rw"><b>'+e(p.talNome)+'</b>'+st+'</div><small style="color:var(--mu)">'+new Date(p.criadoEm).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+' · '+
    p.itens.map(function(i,k){return fq(i.qtd)+' '+e(i.un)+' '+e(i.nome)+(ac&&ac[k]!==undefined&&ac[k]!==i.qtd?' <b>(liberado '+fq(ac[k])+')</b>':'')}).join(' · ')+'</small>'+
    (p.status=='recusado'&&p.motivo?'<br><small class="bad">Motivo: '+e(p.motivo)+'</small>':'')+'</div>'}).join('')+'</div>'}

// ---------- ações ----------
document.addEventListener('click',function(ev){var b=ev.target.closest&&ev.target.closest('button[data-fz]');if(!b)return;var a=b.getAttribute('data-fz'),id=b.getAttribute('data-id'),o=FZ.Ord.filter(function(x){return x.id==id})[0];
  lerCalda();
  if(a=='login'){var u=q('fz_u').value,p=q('fz_p').value,fc=slug(q('fz_f').value);if(!u||!p||!fc){toast('Preencha código da fazenda, usuário e senha');return}ls('fazCod',fc);FZ.msg='Entrando…';tela();
    auth.signInWithEmailAndPassword(emailDe(u,fc),p).catch(function(x){FZ.msg=x.code=='auth/network-request-failed'?'Sem internet. O primeiro login precisa de sinal.':'Usuário ou senha errados';tela()});return}
  if(a=='sair'){if(confirm('Sair da conta da fazenda neste piloto?')){FZ.calda=null;auth.signOut()}return}
  if(a=='doses'&&o){var c=svCur(),d=svDd(c);d.prods=o.itens.map(function(i){return{n:i.nome,dose:String(i.dose),un:/^(kg|g)$/i.test(i.un)?'kg':'L'}});if(o.vazao)d.vazao=String(o.vazao);
    if(typeof S.lyv=='number')S.lyv++;svSave();toast(c.fn=='pulverizacao'?'Doses copiadas para o serviço ✔':'Doses copiadas. Atenção: o serviço atual não é de pulverização.');return}
  if(a=='contar'&&o){var tp=talPiloto(o);FZ.ativa={id:o.id,tal:tp,feito:o.haFeito||0,env:o.haFeito||0,last:nrm(S.tal)==nrm(tp)?S.ar:null};ls('fzAtiva',FZ.ativa);
    if(o.status=='enviada'){var bb=db.batch();bb.set(col('ordens').doc(o.id),{status:'andamento',iniciadaEm:Date.now()},{merge:true});gravar(bb)}toast('Contando a área desta ordem pelo piloto');tela();return}
  if(a=='parar'){FZ.ativa=null;ls('fzAtiva',null);tela();return}
  if(a=='calda'&&o){var ha=num(q('fz_h_'+o.id).value);if(ha<=0){toast('Informe os hectares desta calda');return}
    FZ.calda={ordem:o.id,ordemDesc:(o.servico||'Aplicação')+' · '+o.talNome,ha:ha,tal:o.tal,obs:(o.servico||'')+' · '+fq(ha)+' ha',itens:o.itens.map(function(i){return{pid:i.pid,qtd:+(i.dose*ha).toFixed(3)}})};
    if(o.status=='enviada'){var b2=db.batch();b2.set(col('ordens').doc(o.id),{status:'andamento',iniciadaEm:Date.now()},{merge:true});gravar(b2)}
    tela();q('sb').scrollTop=0;return}
  if(a=='avulsa'){FZ.calda={tal:talFz(S.tal),obs:'',itens:[{pid:'',qtd:0}]};tela();q('sb').scrollTop=0;return}
  if(a=='add'&&FZ.calda){FZ.calda.itens.push({pid:'',qtd:0});tela();return}
  if(a=='rm'&&FZ.calda){FZ.calda.itens.splice(+b.getAttribute('data-k'),1);tela();return}
  if(a=='cx'){FZ.calda=null;tela();return}
  if(a=='enviar'&&FZ.calda){var c2=FZ.calda,its=c2.itens.filter(function(i){return i.pid&&i.qtd>0&&FZ.C[i.pid]});
    if(!c2.tal){toast('Escolha o talhão');return}if(!its.length){toast('Escolha o produto e a quantidade');return}
    if(!confirm('Enviar pedido de baixa:\n'+its.map(function(i){return '• '+fq(i.qtd)+' '+(FZ.C[i.pid].un||'')+' de '+FZ.C[i.pid].nome}).join('\n')+'\n\nTalhão: '+(FZ.T[c2.tal]?FZ.T[c2.tal].nome:'')))return;
    var pd={itens:its.map(function(i){var p=FZ.C[i.pid];return{pid:i.pid,nome:p.nome,un:p.un||'',qtd:i.qtd}}),tal:c2.tal,talNome:FZ.T[c2.tal]?FZ.T[c2.tal].nome:'',data:hoje(),obs:String(c2.obs||'').trim(),
      quem:FZ.uid,nomeQuem:FZ.nome,origem:'piloto',status:'pendente',criadoEm:Date.now()};
    if(c2.ordem){pd.ordem=c2.ordem;pd.ordemDesc=c2.ordemDesc;pd.haCalda=c2.ha}
    var b3=db.batch();b3.set(col('pedidos').doc(),pd);gravar(b3,'Pedido enviado ✔');FZ.calda=null;tela();return}
  if(a=='fim'&&o){if(!confirm('Marcar esta ordem como terminada?'))return;var up={status:'concluida',concluidaEm:Date.now()};
    if(FZ.ativa&&FZ.ativa.id==o.id){up.haFeito=Math.round((FZ.ativa.feito||0)*1000)/1000;FZ.ativa=null;ls('fzAtiva',null)}
    var b4=db.batch();b4.set(col('ordens').doc(o.id),up,{merge:true});gravar(b4,'Ordem concluída ✔');return}
});
document.addEventListener('change',function(ev){if(ev.target.closest&&ev.target.closest('#fz_ci')&&ev.target.tagName=='SELECT'){lerCalda();var a=document.activeElement;if(a)a.blur();tela()}});
window.addEventListener('online',tela);window.addEventListener('offline',tela);
tela();
})();
</script>
<!-- ===== FIM DO MÓDULO FAZENDA ===== -->
